name: Deploy country.7mit (GitHub Pages)
on:
  push:
    branches: [main, master]
    paths: ['cm/web/**', '.github/workflows/deploy-cm.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cm/web
      - id: deployment
        uses: actions/deploy-pages@v4
