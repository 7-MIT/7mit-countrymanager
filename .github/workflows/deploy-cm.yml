name: Deploy country.7mit (GitHub Pages)
# Dijalankan MANUAL saja (Actions -> Run workflow) setelah Settings -> Pages -> Source = GitHub Actions diaktifkan.
# Situs produksi dideploy lewat Cloudflare, jadi workflow ini tidak otomatis jalan agar tidak menghasilkan build merah.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
